# YOLOv8 object detection model with C2f_Att (attention embedded inside C2f Bottlenecks)
# Attention type: Coordinate Attention (CA)
# Model docs: https://docs.ultralytics.com/models/yolov8

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone with C2f_Att (CA inside Bottlenecks)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f_Att, [128, True, "CA"]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f_Att, [256, True, "CA"]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f_Att, [512, True, "CA"]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f_Att, [1024, True, "CA"]]
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head with C2f_Att (CA inside Bottlenecks)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f_Att, [512, False, "CA"]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f_Att, [256, False, "CA"]] # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f_Att, [512, False, "CA"]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f_Att, [1024, False, "CA"]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, ASFF, [0, 256]] # 22 P3/8 fused
  - [[15, 18, 21], 1, ASFF, [1, 512]] # 23 P4/16 fused
  - [[15, 18, 21], 1, ASFF, [2, 1024]] # 24 P5/32 fused
  - [[22, 23, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
